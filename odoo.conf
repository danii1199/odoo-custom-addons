; Odoo 20 común (sin secretos). Lo completa odoo-entrypoint.sh con addons_path (addons/<proyecto>) y la contraseña maestra.
; La contraseña de Postgres llega por variable de entorno (PGPASSWORD). Tras cambiar este archivo: docker restart odoo
[options]
data_dir = /var/lib/odoo
db_host = postgres
db_port = 5432
db_user = odoo
; Escuchar en todas las interfaces del contenedor (Odoo 20 usa 127.0.0.1 por defecto); el puerto lo publica Docker.
http_interface = 0.0.0.0
; Sin selector ni gestor web de bases (/web/database/manager): Odoo está abierto a internet y con la contraseña
; maestra se puede descargar o borrar una base. Las bases se gestionan por consola (odoo db …). La base que se abre
; en el navegador la fija dbfilter (variable de entorno ODOO_DBFILTER, ver odoo-entrypoint.sh).
list_db = False
; Detrás de un proxy HTTPS: fiarse de X-Forwarded-* para generar bien
; las URLs. Odoo 20 necesita HTTPS (contexto seguro) fuera de localhost o el backend se queda en blanco.
proxy_mode = True
workers = 0
max_cron_threads = 1
